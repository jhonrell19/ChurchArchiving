# Put limit_req_zone within the nginx http{} block, e.g. /etc/nginx/conf.d/smartparish-limits.conf
# limit_req_zone $binary_remote_addr zone=parish_auth:10m rate=10r/m;
# This server block assumes a REAL certificate was issued by Let's Encrypt/Certbot.
# Replace parish.example.com and certificate paths with your actual domain.
server {
    listen 80;
    server_name parish.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name parish.example.com;
    ssl_certificate /etc/letsencrypt/live/parish.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/parish.example.com/privkey.pem;
    client_max_body_size 25m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The only publicly exposed service is HTTPS on the reverse proxy.
    location = /api/auth/login {
        limit_req zone=parish_auth burst=5 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:3000;
    }
    location ~ ^/api/auth/(register|forgot-password|resend-verification|reset-password) {
        limit_req zone=parish_auth burst=5 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:3000;
    }
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:3000;
    }
}
